name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes its running checks; main runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - run: nix flake check --print-build-logs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: ony-boom
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The derivation colmena deploys. Pushed to Cachix, so hizuru substitutes
      # it instead of building.
      - run: nix build .#colmenaHive.toplevel.hizuru --print-build-logs --no-link

  deploy:
    needs: [lint, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: ony-boom
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: colmena

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # targetUser is null in the flake, so pin the deploy account here.
          printf 'Host %s\n  User ony\n' "${{ secrets.VPS_HOST }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - run: nix develop -c just deploy
