name: Update inputs

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Flake input to update (or "all")'
        required: true
        default: all
        type: choice
        options: [all, ony-world]

concurrency:
  group: update
  cancel-in-progress: false

env:
  APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Unlike GITHUB_TOKEN, a PAT push triggers CI, which then deploys.
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Update flake input
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if [ "$APP_NAME" = "all" ]; then
            nix flake update --commit-lock-file
          else
            nix flake update "$APP_NAME" --commit-lock-file
          fi

      - name: Push flake.lock
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
